Calculated YDataSource { { '#Compute the rho value, here is not utilization# rho = ([ExponentialService].Mean/[ExponentialIA].Mean); 
#Obtain the number of entities# c = [EntityProcessor1].Capacity; 
#Provide the factorials precalculated# factorial = {1,1,2,6,24}; 
#Compute the probability of the empty system# p0 = 1/(sum(map(|x|(rho^x/factorial(x+1)), range(0,c-1))) + (rho^c/(factorial(c+1)*(1-rho/c))));
#Compute the rest of the probabilities with a lambda function# map(|x|(rho^x*p0/factorial(x+1)),range(0,c)) + map(|x|(rho^x*p0/(factorial(c+1)*c^(x-c))),range(c+1,20))' } }
Calculated XDataSource { { range(0,20) } }
Calculated GraphType { BAR_GRAPH }

