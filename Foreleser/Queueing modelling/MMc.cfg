Observed YDataSource { { '#Fetch the number of entities# c = [EntityProcessor1].Capacity;  
#Probability of having 0 to c-1 entities# filter(|x,i|(i<c+1),[ResourcePool1].UnitsInUseFractions) +  
#Probability of having c entities# {[ResourcePool1].UnitsInUseFractions(c+1) - sum(filter(|x,i|(i>1),[Queue1].QueueLengthFractions))}  +  
#Probability of having more than c entities# filter(|x,i|(i>1 && i<21),[Queue1].QueueLengthFractions)' } }
